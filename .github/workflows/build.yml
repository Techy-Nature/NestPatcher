name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Built patchers match src/
        if: runner.os == 'Linux'
        run: |
          python src/build.py "$RUNNER_TEMP/gen"
          for f in "$RUNNER_TEMP"/gen/*.py; do
            cmp "$f" "patchers/$(basename "$f")" || { echo "::error::patchers/$(basename "$f") is out of date; run python src/build.py"; exit 1; }
          done
      - name: Smoke test Linux patcher
        if: runner.os == 'Linux'
        run: python tests/smoke_test.py patchers/NestPatcher_TiTS_Linux_v*.py
      - name: Smoke test Windows patcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tests/smoke_test.py (Get-ChildItem patchers/NestPatcher_TiTS_Windows_v*.py).FullName
      - name: Smoke test on macOS (Linux patcher logic)
        if: runner.os == 'macOS'
        run: python tests/smoke_test.py patchers/NestPatcher_TiTS_Linux_v*.py

  bundles:
    name: Build GUI bundles
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools gcc-mingw-w64-x86-64 zip
      - name: Build AppImage and Windows zip
        run: packaging/build_bundles.sh
      - name: Smoke test the AppImage's bundled Python and Node.js
        run: |
          NESTPATCHER_NODE=build/bundles/AppDir/usr/node/bin/node \
            python3 tests/smoke_test.py patchers/NestPatcher_TiTS_Linux_v*.py --python build/bundles/AppDir/usr/python/bin/python3
      - uses: actions/upload-artifact@v4
        with:
          name: nestpatcher-gui-bundles
          path: dist/*
          if-no-files-found: error

  windows-bundle:
    name: Check Windows bundle on real Windows
    runs-on: windows-latest
    needs: bundles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nestpatcher-gui-bundles
          path: dist
      - name: Unzip
        shell: pwsh
        run: Expand-Archive (Get-ChildItem dist/*_Windows.zip).FullName -DestinationPath bundle
      - name: Bundled Python and Node.js patch a test game
        shell: pwsh
        run: |
          $root = (Get-ChildItem bundle -Directory)[0].FullName
          $env:NESTPATCHER_NODE = "$root\runtime\node\node.exe"
          & "$root\runtime\python.exe" tests/smoke_test.py (Get-ChildItem patchers/NestPatcher_TiTS_Windows_v*.py).FullName --python "$root\runtime\python.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The .exe starts the GUI server
        shell: pwsh
        run: |
          $root = (Get-ChildItem bundle -Directory)[0].FullName
          $exe = (Get-ChildItem "$root\*.exe")[0].FullName
          # The GUI opens on a random port; read it from its own console output.
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-browser","--port=8765" -WorkingDirectory $root -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\gui.txt"
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/; $ok = $r.Content -match "NestPatcher" } catch {}
          }
          Get-Content "$env:RUNNER_TEMP\gui.txt" -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "NestPatcher_TiTS_GUI" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "GUI did not answer on port 8765"; exit 1 }

  release:
    name: Attach bundles to the release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [bundles, windows-bundle]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nestpatcher-gui-bundles
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
