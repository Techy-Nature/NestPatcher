name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Built patchers match src/
        if: runner.os == 'Linux'
        run: |
          python src/build.py "$RUNNER_TEMP/gen"
          for f in "$RUNNER_TEMP"/gen/*.py; do
            cmp "$f" "patchers/$(basename "$f")" || { echo "::error::patchers/$(basename "$f") is out of date; run python src/build.py"; exit 1; }
          done
      - name: Smoke test Linux patcher
        if: runner.os == 'Linux'
        run: python tests/smoke_test.py patchers/NestPatcher_TiTS_Linux_v*.py
      - name: Smoke test Windows patcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tests/smoke_test.py (Get-ChildItem patchers/NestPatcher_TiTS_Windows_v*.py).FullName
      - name: Smoke test on macOS (Linux patcher logic)
        if: runner.os == 'macOS'
        run: python tests/smoke_test.py patchers/NestPatcher_TiTS_Linux_v*.py
      - name: Android app runs every patcher
        if: runner.os == 'Linux'
        run: python tests/test_android_harness.py
      - name: squashfs-tools for the AppImage export test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Mac app and AppImage export (Linux patcher)
        if: runner.os != 'Windows'
        run: python tests/test_export.py patchers/NestPatcher_TiTS_Linux_v*.py
      - name: Mac app export (Windows patcher)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tests/test_export.py (Get-ChildItem patchers/NestPatcher_TiTS_Windows_v*.py).FullName

  bundles:
    name: Build GUI bundles
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools gcc-mingw-w64-x86-64 zip
      - name: Build AppImage and Windows zip
        run: packaging/build_bundles.sh
      - name: Smoke test the AppImage's bundled Python and Node.js
        run: |
          NESTPATCHER_NODE=build/bundles/AppDir/usr/node/bin/node \
            python3 tests/smoke_test.py patchers/NestPatcher_TiTS_Linux_v*.py --python build/bundles/AppDir/usr/python/bin/python3
      - uses: actions/upload-artifact@v4
        with:
          name: nestpatcher-gui-bundles
          path: dist/*
          if-no-files-found: error

  windows-bundle:
    name: Check Windows bundle on real Windows
    runs-on: windows-latest
    needs: bundles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nestpatcher-gui-bundles
          path: dist
      - name: Unzip
        shell: pwsh
        run: Expand-Archive (Get-ChildItem dist/*_Windows.zip).FullName -DestinationPath bundle
      - name: Bundled Python and Node.js patch a test game
        shell: pwsh
        run: |
          $root = (Get-ChildItem bundle -Directory)[0].FullName
          $env:NESTPATCHER_NODE = "$root\runtime\node\node.exe"
          & "$root\runtime\python.exe" tests/smoke_test.py (Get-ChildItem patchers/NestPatcher_TiTS_Windows_v*.py).FullName --python "$root\runtime\python.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The .exe starts the GUI server
        shell: pwsh
        run: |
          $root = (Get-ChildItem bundle -Directory)[0].FullName
          $exe = (Get-ChildItem "$root\*.exe")[0].FullName
          # The GUI opens on a random port; read it from its own console output.
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-browser","--port=8765" -WorkingDirectory $root -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\gui.txt"
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/; $ok = $r.Content -match "NestPatcher" } catch {}
          }
          Get-Content "$env:RUNNER_TEMP\gui.txt" -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "NestPatcher_TiTS_GUI" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "GUI did not answer on port 8765"; exit 1 }

  apk:
    name: Build Android app (APK)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy needs a matching Python on the build machine.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # GitHub's Ubuntu runners already have the Android SDK (ANDROID_HOME), with licenses accepted.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Signing key (only if the secrets are set)
        env:
          NEST_KEYSTORE_BASE64: ${{ secrets.NEST_KEYSTORE_BASE64 }}
          NEST_KEYSTORE_PASSWORD: ${{ secrets.NEST_KEYSTORE_PASSWORD }}
          NEST_KEY_ALIAS: ${{ secrets.NEST_KEY_ALIAS }}
        run: |
          if [ -z "$NEST_KEYSTORE_BASE64" ]; then
            echo "No signing secrets, so the APK is signed with a throwaway debug key."
            exit 0
          fi
          # Secrets pasted on a phone or from Windows often pick up spaces or line endings.
          printf '%s' "$NEST_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/nest.jks"
          alias=$(printf '%s' "$NEST_KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          echo "::add-mask::$alias"
          if ! keytool -list -keystore "$RUNNER_TEMP/nest.jks" -storepass "$NEST_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keys.txt" 2>&1; then
            echo "::error::Couldn't open the keystore. Check NEST_KEYSTORE_BASE64 holds the whole .jks and NEST_KEYSTORE_PASSWORD is its password."
            grep -iv "password" "$RUNNER_TEMP/keys.txt" | head -5
            exit 1
          fi
          # Key names (aliases) aren't secret; show them so a wrong NEST_KEY_ALIAS is easy to fix.
          echo "Keys inside this keystore:"
          grep -E 'PrivateKeyEntry|trustedCertEntry' "$RUNNER_TEMP/keys.txt" | cut -d, -f1 | sed 's/^/  - /'
          if ! keytool -list -keystore "$RUNNER_TEMP/nest.jks" -storepass "$NEST_KEYSTORE_PASSWORD" -alias "$alias" > /dev/null 2>&1; then
            echo "::error::NEST_KEY_ALIAS doesn't match any key listed above. Set it to one of those names."
            exit 1
          fi
          echo "NEST_KEYSTORE_FILE=$RUNNER_TEMP/nest.jks" >> "$GITHUB_ENV"
          echo "NEST_KEY_ALIAS_CLEAN=$alias" >> "$GITHUB_ENV"
          echo "Signing with your own key."
      - name: Build the APK
        working-directory: android
        env:
          NEST_KEYSTORE_PASSWORD: ${{ secrets.NEST_KEYSTORE_PASSWORD }}
          NEST_KEY_PASSWORD: ${{ secrets.NEST_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Name it with its version
        run: |
          ver=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/NestPatcher_Android_App_v${ver}.apk"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: nestpatcher-android-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Attach bundles to the release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [bundles, windows-bundle, apk]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nestpatcher-gui-bundles
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: nestpatcher-android-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
